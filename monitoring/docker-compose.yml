version: "3.8"

services:
  db:
    image: mariadb:10.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-metrics}
      MARIADB_USER: ${MARIADB_USER:-grafana}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-grafana_password}
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_DB_DRIVER: mysql
      ADMINER_DEFAULT_DB_HOST: db
      ADMINER_DEFAULT_DB_NAME: ${MARIADB_DATABASE:-metrics}
      ADMINER_DESIGN: flat
    ports:
      - "8080:8080"
    depends_on:
      - db

  grafana:
    image: grafana/grafana:9.1.7
    ports:
      - "3000:3000"
    depends_on:
      - db

